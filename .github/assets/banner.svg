<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="li-Scripts — one tidy toolbox for Linux and macOS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#171235"/>
      <stop offset="1" stop-color="#2a0f3a"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>

  <!-- faint dotted grid motif -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="920" cy="60" r="3"/><circle cx="970" cy="60" r="3"/><circle cx="1020" cy="60" r="3"/><circle cx="1070" cy="60" r="3"/><circle cx="1120" cy="60" r="3"/>
    <circle cx="920" cy="110" r="3"/><circle cx="970" cy="110" r="3"/><circle cx="1020" cy="110" r="3"/><circle cx="1070" cy="110" r="3"/><circle cx="1120" cy="110" r="3"/>
    <circle cx="920" cy="160" r="3"/><circle cx="970" cy="160" r="3"/><circle cx="1020" cy="160" r="3"/><circle cx="1070" cy="160" r="3"/><circle cx="1120" cy="160" r="3"/>
  </g>

  <!-- terminal chip -->
  <g transform="translate(72,66)">
    <rect width="150" height="46" rx="10" fill="#0e1426" stroke="#2b3356" stroke-width="1.5"/>
    <circle cx="22" cy="23" r="5" fill="#f87171"/>
    <circle cx="40" cy="23" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="23" r="5" fill="#34d399"/>
    <text x="78" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9fb0d9">./li</text>
  </g>

  <!-- wordmark -->
  <text x="70" y="192" font-family="SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#word)" letter-spacing="-2">li-Scripts</text>

  <rect x="74" y="212" width="520" height="4" rx="2" fill="url(#rule)"/>

  <!-- subtitle -->
  <text x="74" y="256" font-family="SF Pro Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#c7d2fe">One tidy toolbox for Linux &amp; macOS — run anything with <tspan fill="#f0abfc" font-family="ui-monospace, Menlo, monospace">./li</tspan></text>

  <!-- soft accent orbs -->
  <circle cx="1080" cy="235" r="60" fill="#ec4899" opacity="0.18" filter="url(#soft)"/>
  <circle cx="1140" cy="120" r="46" fill="#38bdf8" opacity="0.15" filter="url(#soft)"/>
</svg>
